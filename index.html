<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>卫戍协议 · 规程｜谢拉格冻结叠层一图流</title>
  <meta name="description" content="明日方舟「卫戍协议：规程」谢拉格冻结叠层一图流：主叠层、主输出、装备、站位与 1-14 回合路线。固定 4:3 海报，可编辑、可导出 3200×2400 PNG。" />
  <meta name="theme-color" content="#0b0706" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0706'/%3E%3Cpath d='M14 44V20h8l10 14 10-14h8v24h-8V32L32 46 22 32v12z' fill='%23f6b61e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="regulation-theme.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-actions">
      <span class="save-state" id="saveState" data-state="idle" aria-live="polite">改动自动保存在本机</span>
      <button class="btn btn-ghost" id="mapsBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6zm6-3v15m6-12v15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>战场地图</span>
      </button>
      <button class="btn btn-ghost" id="shareBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v11m0-11 4 4m-4-4-4 4M5 13v7h14v-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>分享</span>
      </button>
      <button class="btn btn-ghost" id="editBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zm11.5-14.5 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>编辑</span>
      </button>
      <button class="btn btn-primary" id="exportBtn" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>导出一图流</span>
      </button>
      <button class="btn btn-ghost btn-help" id="helpBtn" type="button" aria-label="使用说明" title="三步上手">
        <span>?</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="poster-shell" id="posterShell">
      <article class="poster" id="poster" aria-label="卫戍协议规程谢拉格一图流"></article>
    </div>
  </main>

  <section class="mobile-read" id="mobileRead" aria-label="手机阅读版"></section>

  <aside class="drawer drawer-left" id="rosterDrawer" hidden aria-label="干员库">
    <div class="drawer-head">
      <div><strong>干员库</strong><span>行内看盟约与特质；拖到棋盘，或双击看完整详情</span></div>
      <button class="drawer-close" type="button" data-close-drawer="roster" aria-label="关闭干员库">×</button>
    </div>
    <div class="drawer-filters" id="rosterFilters"></div>
    <div class="roster-list" id="rosterList"></div>
  </aside>

  <aside class="drawer drawer-right" id="equipmentDrawer" hidden aria-label="装备库">
    <div class="drawer-head">
      <div><strong>装备库</strong><span>拖到棋盘下方的装备格；点图标看用途</span></div>
      <button class="drawer-close" type="button" data-close-drawer="equipment" aria-label="关闭装备库">×</button>
    </div>
    <div class="drawer-filters"><input class="roster-search" id="equipmentSearch" placeholder="搜索装备" /></div>
    <div class="equipment-detail" id="equipmentDetail"></div>
    <div class="equipment-library" id="equipmentList"></div>
  </aside>

  <aside class="drawer drawer-right" id="variantDrawer" hidden aria-label="备选与变阵">
    <div class="drawer-head">
      <div><strong>备选干员</strong><span>点击头像选中，再点棋盘放置</span></div>
      <button class="drawer-close" type="button" data-close-drawer="variant" aria-label="关闭变阵">×</button>
    </div>
    <div class="variant-body" id="variantBody"></div>
  </aside>

  <div class="edit-bar" id="editBar" hidden>
    <div class="edit-bar-copy">
      <strong>编辑模式</strong>
      <span>改文字、拖站位、点装备/路线头像替换；改动自动保存，Ctrl+Z 撤销。编辑装饰不会进入导出图。</span>
    </div>
    <!-- 按用途分四组：回退 / 摆阵容用的库 / 整份文件的进出 / 危险操作单独放最右 -->
    <div class="edit-bar-actions">
      <div class="edit-group" role="group" aria-label="撤销与重做">
        <button class="btn btn-small btn-icon" id="undoBtn" type="button" data-history="undo" aria-label="撤销" aria-disabled="true" title="没有可撤销的操作">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-small btn-icon" id="redoBtn" type="button" data-history="redo" aria-label="重做" aria-disabled="true" title="没有可重做的操作">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="edit-group" role="group" aria-label="阵容">
        <button class="btn btn-small" id="rosterBtn" type="button" aria-expanded="false">干员库</button>
        <button class="btn btn-small" id="equipmentBtn" type="button" aria-expanded="false">装备库</button>
        <button class="btn btn-small" id="variantBtn" type="button" aria-expanded="false">备选</button>
        <button class="btn btn-small" id="boardBtn" type="button">棋盘</button>
      </div>
      <div class="edit-group" role="group" aria-label="文件">
        <button class="btn btn-small" id="newBtn" type="button">新建</button>
        <button class="btn btn-small" id="saveBtn" type="button">存档</button>
        <button class="btn btn-small" id="importBtn" type="button">导入</button>
        <button class="btn btn-small" id="saveDataBtn" type="button">导出数据</button>
      </div>
      <div class="edit-group">
        <button class="btn btn-small btn-danger" id="resetBtn" type="button">恢复示例</button>
      </div>
    </div>
  </div>

  <div class="zoom-hint" id="zoomHint" hidden>海报在手机上会被缩小。<b>点右下角「放大」</b>按原尺寸查看，可拖动。</div>
  <div class="facing-coach" id="facingCoach" aria-live="polite"></div>
  <button class="zoom-btn read-btn" id="readBtn" type="button" title="切换到手机竖屏阅读版">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 7h6M9 11h6M9 15h3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>阅读版</span>
  </button>
  <button class="zoom-btn" id="zoomBtn" type="button" aria-pressed="false" title="放大看细节（也可双击海报）">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>放大</span>
  </button>
  <input id="importFile" type="file" accept="application/json,.json" hidden />
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="bootError" role="alert" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(6,3,2,.9); align-items:center; justify-content:center; padding:18px;">
    <div style="width:min(560px,100%); max-height:90vh; overflow:auto; padding:18px; background:#170d0a; border:1px solid #c43a2c; border-top:4px solid #f6b61e; color:#f2e3ce; font:14px/1.6 'Microsoft YaHei','PingFang SC',sans-serif; box-shadow:0 20px 60px #000;">
      <div style="color:#f6b61e; font:700 12px/1.4 monospace; letter-spacing:.12em;">MOBILE LOAD ERROR</div>
      <h2 style="margin:4px 0 8px; font-size:22px; line-height:1.2;">手机端加载出错了</h2>
      <p id="bootErrorMsg" style="margin:0 0 8px; color:#ffb4a4; overflow-wrap:anywhere;"></p>
      <pre id="bootErrorStack" style="margin:0 0 12px; max-height:34vh; overflow:auto; padding:8px; background:#0a0605; border:1px solid #4a2b24; color:#d8c8b4; font:12px/1.5 monospace; white-space:pre-wrap;"></pre>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button id="bootReset" type="button" style="min-height:44px; padding:0 14px; border:1px solid #f6b61e; background:#f6b61e; color:#140a06; font:700 14px/1 'Microsoft YaHei','PingFang SC',sans-serif; cursor:pointer;">清空本机数据并重载</button>
        <button id="bootPoster" type="button" style="min-height:44px; padding:0 12px; border:1px solid #8f8b66; background:transparent; color:#f1e6d0; font:700 14px/1 'Microsoft YaHei','PingFang SC',sans-serif; cursor:pointer;">先看海报版</button>
        <button id="bootClose" type="button" style="min-height:44px; padding:0 12px; border:1px solid #4a2b24; background:transparent; color:#a38d7a; font:700 14px/1 'Microsoft YaHei','PingFang SC',sans-serif; cursor:pointer;">关闭</button>
      </div>
      <p style="margin:10px 0 0; color:#a38d7a; font-size:12px;">把上面这段文字截图发我即可定位；清空数据只影响本机草稿，不会改服务器文件。</p>
    </div>
  </div>
  <script>
    (function () {
      var shown = false;
      function show(msg, stack) {
        if (shown) return;
        shown = true;
        var box = document.getElementById('bootError');
        if (!box) return;
        box.style.display = 'flex';
        document.getElementById('bootErrorMsg').textContent = msg || '未知错误';
        document.getElementById('bootErrorStack').textContent = String(stack || '').slice(0, 3000);
      }
      window.__spBootError = show;
      window.addEventListener('error', function (e) {
        if (e && (e.message || e.error)) show(e.message || String(e.error), e.error && e.error.stack);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('Promise: ' + ((r && r.message) || r), r && r.stack);
      });
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('bootReset').onclick = function () {
          try {
            localStorage.removeItem('sp-guide-poster-v2');
            localStorage.removeItem('sp-view-mode-v1');
          } catch (err) { /* ignore */ }
          location.reload();
        };
        document.getElementById('bootPoster').onclick = function () {
          document.body.classList.remove('mobile-ui');
          var mr = document.getElementById('mobileRead');
          if (mr) mr.style.display = 'none';
          try { if (window.__posterDebug) window.__posterDebug.exitMobileUI(); } catch (err) { /* ignore */ }
        };
        document.getElementById('bootClose').onclick = function () {
          document.getElementById('bootError').style.display = 'none';
        };
        setTimeout(function () {
          var dbg = window.__posterDebug;
          var mr = document.getElementById('mobileRead');
          if (!dbg) {
            show('app.js 未启动（可能是脚本加载失败、缓存不完整或语法错误）');
          } else if (document.body.classList.contains('mobile-ui') && mr) {
            var cs = getComputedStyle(mr);
            if (!mr.children.length || cs.display === 'none' || mr.getBoundingClientRect().height < 40) {
              show('手机阅读版不可见（可能是样式缓存不完整或本机存档数据异常）');
            }
          }
        }, 20000);
      });
    })();
  </script>

  <script src="vendor/html-to-image.js"></script>
  <script src="vendor/lz-string.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="assets-embed.js"></script>
  <script src="data/stronghold.js"></script>
  <script src="data/closure.js"></script>
  <script src="data/roster-prts.js"></script>
  <script src="data/prts.js"></script>
  <script src="data/modules.js"></script>
  <script src="data/pinyin.js"></script>
  <script src="data/maps.js"></script>
  <script src="data/ranges.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
